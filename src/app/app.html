<div *ngIf="showLoader" class="app-loader fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 backdrop-blur-sm">
  <div class="loader-card rounded-[2rem] p-4 text-center">
    <div class="mx-auto mb-6 flex h-44 w-44 items-center justify-center rounded-full ">
      <img src="/loader.png" alt="Loading" class="loader-image" decoding="async" />
    </div>
 
  </div>
</div>
<app-toast-container></app-toast-container>
<header class="sticky top-0 z-50 border-b border-[#4a524c]/70 bg-[#4a524c] backdrop-blur-md shadow-black/5 shadow-sm">
  <mat-toolbar class="flex flex-wrap items-center gap-3 px-4 py-3 sm:px-2 bg-transparent" style="background: transparent;">
    <div class="flex items-center gap-3">
      <a routerLink="/" class="h-14 w-16 overflow-hidden rounded-2xl bg-white/10 cursor-pointer">
        <img src="favicon.png" alt="Portfolio logo" class="h-full w-full object-cover" decoding="async" />
      </a>
    </div>

    <nav class="hidden flex-1 items-center gap-6 sm:flex sm:px-2">
      <a routerLink="/" routerLinkActive="header-link--active" [routerLinkActiveOptions]="{ exact: true }" matTooltip="Go to Home" class="header-link inline-flex items-center rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-slate-100 transition">{{ labels[language()].home }}</a>
      <a routerLink="/projects" routerLinkActive="header-link--active" matTooltip="View Projects" class="header-link inline-flex items-center rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-slate-100 transition">{{ labels[language()].projects }}</a>
      <a routerLink="/certifications" routerLinkActive="header-link--active" matTooltip="View Certifications" class="header-link inline-flex items-center rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-slate-100 transition">{{ labels[language()].certifications }}</a>
      <a routerLink="/about" routerLinkActive="header-link--active" matTooltip="Learn About Me" class="header-link inline-flex items-center rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-slate-100 transition">{{ labels[language()].about }}</a>
      <a routerLink="/contact" routerLinkActive="header-link--active" matTooltip="Contact Me" class="header-link inline-flex items-center rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-slate-100 transition">{{ labels[language()].contact }}</a>
    </nav>

    <div class="ml-auto flex items-center">
      <div class="language-switch" matTooltip="Toggle Language">
  <input
    id="language_toggle"
    type="checkbox"
    class="language-switch__input hidden"
    [checked]="language() === 'en'"
    (change)="toggleLanguage()"
  />
  <label for="language_toggle" class="language-switch__control">
    <span class="language-switch__thumb">
      {{ language() === 'ua' ? 'UA' : 'EN' }}
    </span>
  </label>
</div>

    </div>
  </mat-toolbar>
</header>

<main class="px-4 py-5 sm:px-2">
  <router-outlet></router-outlet>
</main>

<button *ngIf="showScrollTop" type="button" (click)="scrollToTop()" matTooltip="Scroll to top" class="fixed bottom-6 right-6 z-50 inline-flex h-14 w-14 items-center justify-center rounded-full bg-cyan-600 text-white shadow-2xl shadow-cyan-500/20 transition hover:bg-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-300">
  <span class="text-2xl">↑</span>
</button>
